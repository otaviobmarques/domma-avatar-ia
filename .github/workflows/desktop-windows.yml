# Gera o instalador do Domma AvatarIA para Windows e publica nas Releases.
# Para lançar uma versão: aumente "version" em desktop/package.json e envie para o main.
# O electron-builder cria a Release v<versão> com o instalador (e o latest.yml da atualização automática).
# Se a versão já estiver publicada, nada é substituído.
name: App Windows

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Gerar e publicar o instalador
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
