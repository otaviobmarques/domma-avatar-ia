# Gera o instalador do Domma AvatarIA para Windows e publica nas Releases.
# Para lançar uma versão: aumente "version" em desktop/package.json e envie para o main.
# O electron-builder cria a Release v<versão> com o instalador (e o latest.yml da atualização automática).
# Se a versão já estiver publicada, nada é substituído.
name: App Windows

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Gerar o instalador
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Ler a versão
        id: versao
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publicar na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.v }}
          name: Domma AvatarIA ${{ steps.versao.outputs.v }} para Windows
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          body: |
            Aplicativo do Domma AvatarIA para Windows 10 e 11 (64 bits).

            Baixe **Domma-AvatarIA-Setup-${{ steps.versao.outputs.v }}.exe** abaixo. Se o Windows mostrar "O Windows protegeu o computador", clique em "Mais informações" e depois em "Executar assim mesmo".
          files: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
